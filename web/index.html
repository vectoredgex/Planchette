<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planchette</title>
<meta name="description" content="A Ouija board moved by an open-weight model's real probabilities. Runs offline.">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 6C68 12 92 44 86 72 82 90 62 96 50 90 38 96 18 90 14 72 8 44 32 12 50 6Z' fill='%234a2b16'/><circle cx='50' cy='38' r='15' fill='%23f2a033'/></svg>">
</head>
<body>
<main>
  <header class="intro">
    <div class="mark">
      <svg class="orn" viewBox="0 0 90 14" aria-hidden="true"><path d="M0 7h70" stroke="currentColor" stroke-width="1" opacity=".7"/><path d="M75 7l6-6 6 6-6 6z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="81" cy="7" r="1.8" fill="currentColor"/></svg>
      <h1>Planchette</h1>
      <svg class="orn flip" viewBox="0 0 90 14" aria-hidden="true"><path d="M0 7h70" stroke="currentColor" stroke-width="1" opacity=".7"/><path d="M75 7l6-6 6 6-6 6z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="81" cy="7" r="1.8" fill="currentColor"/></svg>
    </div>
    <p id="explain">An open AI model moves the planchette with its real odds for every letter. When it hesitates, the model is truly torn.</p>
  </header>

  <div class="stage">
    <canvas id="board" role="img" aria-label="A black Ouija board on a velvet table, lit by candles, with a planchette"></canvas>
    <p class="notice" id="notice" hidden></p>
  </div>

  <div class="spoken" aria-live="polite">
    <div class="cells" id="cells"></div>
    <p class="hint" id="hint"></p>
  </div>

  <form class="ask" id="ask" autocomplete="off">
    <button type="button" class="mic" id="mic" hidden title="Hold to ask out loud">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-7 9a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2a5 5 0 0 1-10 0H5Z"/></svg>
      <span class="sr">Hold to speak your question</span>
    </button>
    <label class="sr" for="q">Your question</label>
    <input id="q" name="q" maxlength="200" placeholder="Ask the spirit…">
    <button type="submit" id="askBtn">Ask</button>
    <button type="button" id="byeBtn" hidden>Say goodbye</button>
  </form>

  <div class="examples" id="examples" aria-label="Example questions"></div>

  <div class="spirits" id="personas" role="radiogroup" aria-label="Which spirit to summon"></div>
  <div class="advanced" id="advanced" hidden><span class="k">Models</span> <span id="hands"></span></div>

  <ul class="recs" id="recs" hidden></ul>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
